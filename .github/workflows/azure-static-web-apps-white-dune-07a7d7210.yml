name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - azure
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - azure

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    outputs:
      static_web_app_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          API_URL: ${{ secrets.API_URL }}
          WS_URL: ${{ secrets.WS_URL }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DUNE_07A7D7210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist/ViviGo_Frontend/browser"

  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Run Cypress E2E Tests
    needs: build_and_deploy_job
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-15.15.0
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install Cypress binary
        run: npx cypress install --force

      - name: Wait for deployed app to be ready
        run: |
          URL="${{ needs.build_and_deploy_job.outputs.static_web_app_url }}"
          echo "Checking URL: $URL"
          for i in {1..30}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "App is ready!"
              exit 0
            fi
            sleep 10
          done
          echo "App did not become ready in time"
          exit 1

      - name: Verify TestRail credentials presence
        run: |
          echo "TESTRAIL_HOST present: $( [ -n '${{ secrets.TESTRAIL_HOST }}' ] && echo 'YES' || echo 'NO' )"
          echo "TESTRAIL_USER present: $( [ -n '${{ secrets.TESTRAIL_USER }}' ] && echo 'YES' || echo 'NO' )"
          echo "TESTRAIL_API_KEY present: $( [ -n '${{ secrets.TESTRAIL_API_KEY }}' ] && echo 'YES' || echo 'NO' )"
          echo "TESTRAIL_PROJECT_ID present: $( [ -n '${{ secrets.TESTRAIL_PROJECT_ID }}' ] && echo 'YES' || echo 'NO' )"
          echo "TESTRAIL_SUITE_ID present: $( [ -n '${{ secrets.TESTRAIL_SUITE_ID }}' ] && echo 'YES' || echo 'NO' )"

      - name: Test TestRail API connectivity
        id: testrail_check
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -u "${{ secrets.TESTRAIL_USER }}:${{ secrets.TESTRAIL_API_KEY }}" \
            "${{ secrets.TESTRAIL_HOST }}/index.php?/api/v2/get_projects" \
            || echo "000")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "TestRail API status: $STATUS"

      - name: Run Cypress against deployed app
        run: |
          export CYPRESS_BASE_URL="${{ needs.build_and_deploy_job.outputs.static_web_app_url }}"
          export CYPRESS_apiUrl="${{ secrets.API_URL }}"

          if [ "${{ steps.testrail_check.outputs.status }}" = "200" ]; then
            export CYPRESS_TESTRAIL_HOST="${{ secrets.TESTRAIL_HOST }}"
            export CYPRESS_TESTRAIL_USERNAME="${{ secrets.TESTRAIL_USER }}"
            export CYPRESS_TESTRAIL_API_KEY="${{ secrets.TESTRAIL_API_KEY }}"
            export CYPRESS_TESTRAIL_PROJECT_ID="${{ secrets.TESTRAIL_PROJECT_ID }}"
            export CYPRESS_TESTRAIL_SUITE_ID="${{ secrets.TESTRAIL_SUITE_ID }}"
            echo "TestRail reporter ENABLED"
          else
            echo "TestRail reporter DISABLED (API status: ${{ steps.testrail_check.outputs.status }})"
          fi

          npx cypress run --headless --browser electron

      - name: Upload Cypress screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/

      - name: Upload Cypress videos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_DUNE_07A7D7210 }}
          action: "close"
